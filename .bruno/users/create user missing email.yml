info:
  name: create user missing email
  type: http
  seq: 12

http:
  method: POST
  url: "{{host}}/users"
  body:
    type: json
    data: |-
      {
        "email": "",
        "auth_hash": "{{auth_hash}}",
        "encrypted_master_key": "encrypted-master-key-base64",
        "key_params": {
          "algorithm": "argon2id",
          "salt": "salt-base64",
          "iterations": 3,
          "memory": 65536,
          "parallelism": 4
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
