info:
  name: allow same name different currency
  type: http
  seq: 7

http:
  method: POST
  url: "{{host}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "cash",
        "initial_balance": "50",
        "type": "cash",
        "currency": "USD"
      }
  auth: inherit

docs: |-
  Run "create cash account" (cash / COP) first. Same name in a different
  currency is allowed for the same user. Expect 201 with the full account body.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
