info:
  name: create cash account
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "cash",
        "initial_balance": "100000",
        "type": "cash",
        "currency": "COP"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
