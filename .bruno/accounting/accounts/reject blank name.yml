http:
  method: POST
  url: "{{host}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "   ",
        "initial_balance": "100000",
        "type": "savings",
        "currency": "COP"
      }
  auth: inherit

docs: |-
  Expect 400 with body { "error": "El nombre es obligatorio" }.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
