info:
  name: reject invalid currency
  type: http
  seq: 9

http:
  method: POST
  url: "{{host}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Revolut",
        "initial_balance": "100000",
        "type": "savings",
        "currency": "EUR"
      }
  auth: inherit

docs: |-
  Currency must be one of COP, USD. Expect 400 with body
  { "error": "Moneda inválida" }.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
