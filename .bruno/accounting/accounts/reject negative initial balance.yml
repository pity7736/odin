info:
  name: reject negative initial balance
  type: http
  seq: 11

http:
  method: POST
  url: "{{host}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Nequi",
        "initial_balance": "-100",
        "type": "savings",
        "currency": "COP"
      }
  auth: inherit

docs: |-
  Balance parses as a number but is below zero. Expect 400 with body
  { "error": "El saldo inicial no puede ser negativo" }.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
