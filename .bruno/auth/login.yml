info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "some@email.com",
        "auth_hash": "{{auth_hash}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.token) {
          bru.setEnvVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
